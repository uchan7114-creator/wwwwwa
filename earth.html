<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Earth Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
}

#map{
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// 지도 생성
const map = L.map('map',{
    worldCopyJump:true
}).setView([20,0],2);

// 실제 지도(도로)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'© OpenStreetMap'
}).addTo(map);

// 예시 마커
L.circleMarker([37.5,127],{
    radius:8,
    color:"red",
    fillColor:"orange",
    fillOpacity:1
}).addTo(map);

</script>

</body>
</html>
