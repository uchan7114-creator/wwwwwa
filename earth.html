<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>세계 지진 지도</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body{
    width:100%;
    height:100%;
    margin:0;
}

#map{
    width:100%;
    height:100%;
}

.leaflet-popup-content{
    font-size:14px;
}
</style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// 지도 생성
const map = L.map("map",{
    worldCopyJump:true
}).setView([20,0],2);

// 실제 세계지도
L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19,
    attribution:'© OpenStreetMap'
}).addTo(map);

// 최근 30일 M5.0 이상 지진
const url =
"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/5.0_month.geojson";

fetch(url)
.then(r=>r.json())
.then(data=>{

    data.features.forEach(eq=>{

        const lon=eq.geometry.coordinates[0];
        const lat=eq.geometry.coordinates[1];
        const depth=eq.geometry.coordinates[2];

        const mag=eq.properties.mag;
        const place=eq.properties.place;

        const time=new Date(eq.properties.time);

        // 규모에 따라 원 크기
        let radius=6+mag*2;

        let color="orange";

        if(mag>=7) color="red";
        else if(mag>=6) color="darkorange";

        L.circleMarker([lat,lon],{

            radius:radius,
            color:"#333",
            weight:1,
            fillColor:color,
            fillOpacity:0.9

        })
        .addTo(map)
        .bindPopup(
        `
        <b>규모(M)</b> : ${mag}<br>
        <b>위치</b> : ${place}<br>
        <b>깊이</b> : ${depth} km<br>
        <b>시간</b> : ${time.toLocaleString()}<br>
        <b>위도</b> : ${lat.toFixed(3)}<br>
        <b>경도</b> : ${lon.toFixed(3)}
        `);

    });

});

</script>

</body>
</html>
