<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>베이스볼 스타디움</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1e3932; /* 야구장 잔디를 연상시키는 짙은 초록색 */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #ffffff;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        p {
            font-size: 1.2rem;
            color: #f0f0f0;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #ff4757; /* 야구 실밥을 연상시키는 붉은 톤 */
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #e84118;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚾ BASEBALL HUB</h1>
        <p>열정적인 야구 팬들을 위한 공간입니다.</p>
        <a href="#" class="btn">경기 보러가기</a>
    </div>
</body>
</html>
