<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니 슈팅 게임</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #ui {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #00ffcc;
        }
        #gameCanvas {
            background-color: #000;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            border-radius: 8px;
        }
        .info {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="ui">SCORE: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <div class="info">조작법: 좌우 방향키(←, →) - 이동 / 스페이스바(Space) - 발사</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");

        // 게임 상태 변수
        let score = 0;
        let isGameOver = false;

        // 플레이어 설정 (비행기)
        const player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 50,
            width: 30,
            height: 30,
            speed: 5
        };

        // 배열 관리 (미사일, 적)
        let bullets = [];
        let enemies = [];

        // 키 입력 감지 상태
        let keys = { ArrowLeft: false, ArrowRight: false, Space: false };
        let canShoot = true; // 연속 발사 제한 타이머용

        // 이벤트 리스너 등록
        document.addEventListener("keydown", (e) => {
            if (e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "Space") {
                if (e.code === "Space") e.preventDefault(); // 스페이스바 화면 스크롤 방지
                keys[e.code] = true;
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "Space") {
                keys[e.code] = false;
                if (e.code === "Space") canShoot = true; // 스페이스바를 떼면 다시 발사 가능
            }
        });

        // 적 스폰 타이머 (1초마다 생성)
        setInterval(() => {
            if (isGameOver) return;
            enemies.push({
                x: Math.random() * (canvas.width - 25),
                y: -30,
                width: 25,
                height: 25,
                speed: Math.random() * 2 + 1.5
            });
        }, 1000);

        // 충돌 판정 함수 (AABB)
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // 메인 업데이트 및 그리기 루프
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!isGameOver) {
                // 1. 플레이어 이동 처리
                if (keys.ArrowLeft && player.x > 0) player.x -= player.speed;
                if (keys.ArrowRight && player.x < canvas.width - player.width) player.x += player.speed;

                // 2. 미사일 발사 처리
                if (keys.Space && canShoot) {
                    bullets.push({
                        x: player.x + player.width / 2 - 2.5,
                        y: player.y,
                        width: 5,
                        height: 12,
                        speed: 7
                    });
                    canShoot = false; // 연사 속도 조절을 위해 발사 잠금
                    setTimeout(() => { if (keys.Space === false) canShoot = true; }, 150); // 최소 연사 간격
                }

                // 3. 미사일 업데이트 및 그리기
                bullets.forEach((bullet, index) => {
                    bullet.y -= bullet.speed;
                    ctx.fillStyle = "#ffff00";
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);

                    // 화면 밖으로 나간 미사일 삭제
                    if (bullet.y < 0) bullets.splice(index, 1);
                });

                // 4. 적 업데이트 및 그리기
                enemies.forEach((enemy, eIndex) => {
                    enemy.y += enemy.speed;
                    ctx.fillStyle = "#ff4d4d";
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

                    // 플레이어와 적의 충돌 검사 -> 게임 오버
                    if (checkCollision(player, enemy)) {
                        isGameOver = true;
                    }

                    // 미사일과 적의 충돌 검사
                    bullets.forEach((bullet, bIndex) => {
                        if (checkCollision(bullet, enemy)) {
                            enemies.splice(eIndex, 1);
                            bullets.splice(bIndex, 1);
                            score += 10;
                            scoreEl.innerText = score;
                        }
                    });

                    // 바닥에 닿은 적 삭제
                    if (enemy.y > canvas.height) enemies.splice(eIndex, 1);
                });

                // 5. 플레이어 그리기
                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(player.x, player.y, player.width, player.height);

                requestAnimationFrame(gameLoop);
            } else {
                // 게임 오버 스크린 출력
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff4d4d";
                ctx.font = "30px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
                
                ctx.fillStyle = "#fff";
                ctx.font = "16px sans-serif";
                ctx.fillText("새로고침(F5)을 눌러 다시 시작하세요", canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        // 최초 실행
        gameLoop();
    </script>
</body>
</html>
